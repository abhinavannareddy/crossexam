<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">CrossExam deployment architecture</title>
  <desc id="d">An analyst or client calls a FastAPI service on localhost. The service runs the LangGraph investigator over synthetic data held in SQLite and a networkx graph, and writes every step to a hash-chained audit log stored in a Docker volume. An optional Cypher export loads the graph into Neo4j.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52514e"/></marker>
  </defs>
  <rect width="960" height="520" fill="#fcfcfb"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#0b0b0b">How the pieces fit together</text>
  <text x="24" y="58" font-size="12.5" fill="#52514e">One container runs the API. The audit log lives in a volume, so it survives restarts. Case state does not.</text>

  <!-- caller -->
  <rect x="24" y="150" width="150" height="86" rx="10" fill="#0b0b0b"/>
  <g text-anchor="middle" fill="#fff"><text x="99" y="182" font-size="14" font-weight="700">Analyst</text><text x="99" y="202" font-size="11.5" fill="#d9d8d2">browser, curl or</text><text x="99" y="218" font-size="11.5" fill="#d9d8d2">another program</text></g>
  <line x1="174" y1="193" x2="248" y2="193" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="211" y="184" text-anchor="middle" font-size="11" fill="#52514e">HTTP</text>
  <text x="211" y="214" text-anchor="middle" font-size="10.5" fill="#52514e">127.0.0.1:8000</text>

  <!-- container -->
  <rect x="250" y="84" width="690" height="332" rx="14" fill="#f6f5f1" stroke="#9c9b94" stroke-dasharray="6 4"/>
  <text x="268" y="106" font-size="12" font-weight="600" fill="#52514e">DOCKER CONTAINER  (python:3.12-slim, non-root user, health check on /health)</text>

  <rect x="270" y="124" width="190" height="150" rx="10" fill="#e8f0fb" stroke="#2a78d6" stroke-width="1.6"/>
  <g text-anchor="middle"><text x="365" y="150" font-size="14" font-weight="700" fill="#0b0b0b">FastAPI service</text>
  <text x="365" y="174" font-size="11.5" fill="#52514e" font-family="Consolas, monospace">GET  /alerts</text>
  <text x="365" y="192" font-size="11.5" fill="#52514e" font-family="Consolas, monospace">POST /investigate/{acc}</text>
  <text x="365" y="210" font-size="11.5" fill="#52514e" font-family="Consolas, monospace">POST /decide/{case}</text>
  <text x="365" y="228" font-size="11.5" fill="#52514e" font-family="Consolas, monospace">GET  /audit/{case}</text>
  <text x="365" y="246" font-size="11.5" fill="#52514e" font-family="Consolas, monospace">GET  /health</text>
  <text x="365" y="264" font-size="10.5" fill="#52514e">409 if already decided</text></g>

  <line x1="460" y1="199" x2="508" y2="199" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="510" y="124" width="200" height="150" rx="10" fill="#e3f5ee" stroke="#1baf7a" stroke-width="1.6"/>
  <g text-anchor="middle"><text x="610" y="150" font-size="14" font-weight="700" fill="#0b0b0b">Investigator</text>
  <text x="610" y="174" font-size="11.5" fill="#52514e">LangGraph workflow:</text>
  <text x="610" y="192" font-size="11.5" fill="#52514e">supervisor, evidence agents,</text>
  <text x="610" y="210" font-size="11.5" fill="#52514e">prosecutor, defender,</text>
  <text x="610" y="228" font-size="11.5" fill="#52514e">referee, case writer</text>
  <text x="610" y="258" font-size="10.5" fill="#52514e">case state in memory</text></g>

  <line x1="710" y1="170" x2="758" y2="170" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="760" y="124" width="160" height="94" rx="10" fill="#fff" stroke="#c9c8c2"/>
  <g text-anchor="middle"><text x="840" y="150" font-size="13" font-weight="700" fill="#0b0b0b">Synthetic data</text>
  <text x="840" y="172" font-size="11.5" fill="#52514e">SQLite transactions</text>
  <text x="840" y="190" font-size="11.5" fill="#52514e">networkx money graph</text>
  <text x="840" y="208" font-size="11.5" fill="#52514e">trained model, policy text</text></g>

  <!-- audit -->
  <path d="M610 274 V320 H560" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="270" y="304" width="290" height="92" rx="10" fill="#fff" stroke="#c9c8c2"/>
  <g text-anchor="middle"><text x="415" y="330" font-size="13" font-weight="700" fill="#0b0b0b">Audit log (hash chain)</text>
  <text x="415" y="352" font-size="11.5" fill="#52514e">every agent step and every analyst decision</text>
  <text x="415" y="370" font-size="11.5" fill="#52514e">a recorded decision blocks a second one</text>
  <text x="415" y="388" font-size="10.5" fill="#52514e">entry written before the case status changes</text></g>
  <line x1="365" y1="274" x2="365" y2="302" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- volume -->
  <path d="M415 396 V440" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="300" y="442" width="230" height="52" rx="8" fill="#f1f0ec" stroke="#9c9b94"/>
  <g text-anchor="middle"><text x="415" y="464" font-size="12.5" font-weight="700" fill="#0b0b0b">Docker volume  /data</text><text x="415" y="482" font-size="11" fill="#52514e" font-family="Consolas, monospace">crossexam_audit.db</text></g>

  <!-- neo4j -->
  <path d="M840 218 V300" fill="none" stroke="#52514e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="640" y="304" width="280" height="92" rx="10" fill="#fff" stroke="#c9c8c2" stroke-dasharray="5 4"/>
  <g text-anchor="middle"><text x="780" y="330" font-size="13" font-weight="700" fill="#0b0b0b">Optional: Neo4j export</text>
  <text x="780" y="352" font-size="11.5" fill="#52514e">python -m crossexam.cypher graph.cypher</text>
  <text x="780" y="370" font-size="11.5" fill="#52514e">checked against Neo4j 5: counts match</text>
  <text x="780" y="388" font-size="10.5" fill="#52514e">not part of the running service</text></g>

  <text x="24" y="440" font-size="11.5" fill="#52514e">The port is bound to this machine</text>
  <text x="24" y="458" font-size="11.5" fill="#52514e">only: the API has no authentication.</text>
</svg>
