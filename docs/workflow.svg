<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How CrossExam handles one alert</title>
  <desc id="d">An alert goes to a supervisor, which chooses evidence agents. A prosecutor and a defender argue from the evidence, a referee weighs them, a case writer produces a cited note, and a human analyst decides. Every step is written to a hash-chained audit log, and the analyst decision feeds precedent memory.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52514e"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#eb6834"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2a78d6"/></marker>
  </defs>
  <rect width="960" height="690" fill="#fcfcfb"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#0b0b0b">How CrossExam handles one alert</text>
  <text x="24" y="58" font-size="12.5" fill="#52514e">Rules (R1 to R5) or a model score raise the alert. The system recommends. Only the analyst decides.</text>

  <!-- alert + supervisor -->
  <rect x="24" y="84" width="170" height="52" rx="8" fill="#f1f0ec" stroke="#c9c8c2"/>
  <text x="109" y="107" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Alert</text>
  <text x="109" y="125" text-anchor="middle" font-size="11.5" fill="#52514e">account + score + rules</text>
  <line x1="194" y1="110" x2="248" y2="110" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="250" y="84" width="200" height="52" rx="8" fill="#f1f0ec" stroke="#c9c8c2"/>
  <text x="350" y="107" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Supervisor</text>
  <text x="350" y="125" text-anchor="middle" font-size="11.5" fill="#52514e">picks which agents to run</text>

  <!-- evidence agents -->
  <text x="474" y="104" font-size="12" font-weight="600" fill="#52514e">EVIDENCE AGENTS</text>
  <text x="474" y="122" font-size="12" fill="#52514e">Each result becomes a numbered fact: E1, E2, ...</text>
  <g font-size="12.5" fill="#0b0b0b" text-anchor="middle">
    <rect x="24" y="188" width="166" height="64" rx="8" fill="#fff" stroke="#c9c8c2"/><text x="107" y="212" font-weight="600">History</text><text x="107" y="231" fill="#52514e" font-size="11.5">SQL: 30 and 60 day flows</text>
    <rect x="202" y="188" width="166" height="64" rx="8" fill="#fff" stroke="#c9c8c2"/><text x="285" y="212" font-weight="600">Money flow</text><text x="285" y="231" fill="#52514e" font-size="11.5">loops and chains (graph)</text>
    <rect x="380" y="188" width="166" height="64" rx="8" fill="#fff" stroke="#c9c8c2"/><text x="463" y="212" font-weight="600">Profile</text><text x="463" y="231" fill="#52514e" font-size="11.5">customer type, documents</text>
    <rect x="558" y="188" width="166" height="64" rx="8" fill="#fff" stroke="#c9c8c2"/><text x="641" y="212" font-weight="600">Policy search</text><text x="641" y="231" fill="#52514e" font-size="11.5">7 guidance snippets</text>
    <rect x="736" y="188" width="200" height="64" rx="8" fill="#fff" stroke="#c9c8c2"/><text x="836" y="212" font-weight="600">Precedent</text><text x="836" y="231" fill="#52514e" font-size="11.5">nearest closed cases</text>
  </g>
  <path d="M350 136 V160 H107 V188" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M350 160 H836 V188" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="285" y1="160" x2="285" y2="188" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="463" y1="160" x2="463" y2="188" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="641" y1="160" x2="641" y2="188" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- prosecutor / defender -->
  <path d="M463 252 V282 H280 V302" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M463 252 V282 H680 V302" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="120" y="304" width="320" height="76" rx="10" fill="#fdeee8" stroke="#eb6834" stroke-width="1.6"/>
  <text x="280" y="332" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Prosecutor</text>
  <text x="280" y="352" text-anchor="middle" font-size="12" fill="#52514e">argues why it looks suspicious</text>
  <text x="280" y="368" text-anchor="middle" font-size="12" fill="#52514e">each argument: weight + evidence IDs</text>
  <rect x="520" y="304" width="320" height="76" rx="10" fill="#e8f0fb" stroke="#2a78d6" stroke-width="1.6"/>
  <text x="680" y="332" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Defender</text>
  <text x="680" y="352" text-anchor="middle" font-size="12" fill="#52514e">argues for a legitimate explanation</text>
  <text x="680" y="368" text-anchor="middle" font-size="12" fill="#52514e">each argument: weight + evidence IDs</text>

  <!-- referee -->
  <path d="M280 380 V424 H378" fill="none" stroke="#eb6834" stroke-width="1.6" marker-end="url(#o)"/>
  <path d="M680 380 V424 H582" fill="none" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#b)"/>
  <rect x="380" y="396" width="200" height="56" rx="10" fill="#e3f5ee" stroke="#1baf7a" stroke-width="1.6"/>
  <text x="480" y="420" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0b0b">Referee</text>
  <text x="480" y="438" text-anchor="middle" font-size="11.5" fill="#52514e">noisy-OR of each side, then net</text>

  <!-- outcome -->
  <line x1="480" y1="452" x2="480" y2="486" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="300" y="488" width="360" height="72" rx="10" fill="#fff" stroke="#c9c8c2"/>
  <text x="480" y="512" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">Recommendation (not a decision)</text>
  <text x="480" y="531" text-anchor="middle" font-size="12" fill="#52514e">escalate  |  send to analyst  |  suggest close</text>
  <text x="480" y="548" text-anchor="middle" font-size="11.5" fill="#52514e">case writer drafts a note with [E#] citations</text>

  <!-- analyst -->
  <line x1="480" y1="560" x2="480" y2="584" stroke="#52514e" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="350" y="586" width="260" height="52" rx="10" fill="#0b0b0b"/>
  <text x="480" y="609" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Human analyst</text>
  <text x="480" y="627" text-anchor="middle" font-size="11.5" fill="#d9d8d2">/decide is the only way a case changes status</text>
  <path d="M610 612 H948 V220 H938" fill="none" stroke="#52514e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="780" y="604" text-anchor="middle" font-size="11.5" fill="#52514e">the decision is stored as precedent memory</text>

  <!-- audit log -->
  <rect x="24" y="652" width="912" height="30" rx="8" fill="#f1f0ec" stroke="#c9c8c2"/>
  <text x="480" y="672" text-anchor="middle" font-size="12" fill="#0b0b0b"><tspan font-weight="700">Audit log</tspan>: every step above is appended to a hash chain. Edits are detectable, and an outside copy of the latest hash detects deleted entries.</text>
</svg>
